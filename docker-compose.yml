services:
  api:
    build:
      context: .
      dockerfile: TravelCheck.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CosmosDb__AccountEndpoint: https://localhost:8081
      CosmosDb__AccountKey: C2VydmljZUVuY3J5cHRpb25LZXk=
      ServiceBus__ConnectionString: Endpoint=sb://fake/;SharedAccessKeyName=Root;SharedAccessKey=fakekey=
    depends_on:
      - cosmosdb

  worker:
    build:
      context: .
      dockerfile: TravelCheck.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      CosmosDb__AccountEndpoint: https://localhost:8081
      CosmosDb__AccountKey: C2VydmljZUVuY3J5cHRpb25LZXk=
      ServiceBus__ConnectionString: Endpoint=sb://fake/;SharedAccessKeyName=Root;SharedAccessKey=fakekey=
    depends_on:
      - cosmosdb

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator
    container_name: cosmosdb
    ports:
      - "8081:8081"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 2
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined